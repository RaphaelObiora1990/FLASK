---
- name: Ensure deploy dir exists
  file:
    path: "{{ deploy_dir }}"
    state: directory
    mode: "0755"

- name: Ensure venv dir exists
  file:
    path: "{{ venv_dir }}"
    state: directory
    mode: "0755"

- name: Show artifact (sanity)
  debug:
    msg: "Deploying {{ app_name }} from s3://{{ s3_bucket }}/{{ artifact }}"
